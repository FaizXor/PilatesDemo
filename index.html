<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pilates Studio Demo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Header -->
    <header id="site-header">
        <div class="logo">
            <img src="" alt="Numa Studio Logo">
            <p></p>
        </div>
        <button id="menu-btn" type="button" aria-label="Menü"></button>
    </header>

    <!-- Main Content -->
    <main class="content">

        <!-- 1. Hero Section -->
        <section class="firstcontainer hero-section">
            <div class="infocontainer">
                <div class="header1"></div>
                <div><button class="signinbutton" type="button"></button></div>
            </div>
            <div class="bgimage"><img src="" alt="Hero Visual"></div>
        </section>

        <!-- 2. Courses -->
        <section class="secondcontainer courses-section">
            <div class="header2">
                <p></p>
            </div>
            <div class="lessonbuttons">
                <div class="oneonelesson">
                    <div class="card-overlay"></div>
                    <p class="lesson-title"></p>
                    <p class="lesson-desc desktop-only">Eğitmen eşliğinde kişiye özel reformer ve mat antrenmanları.</p>
                    <a href="#" class="card-btn desktop-only">Detaylı Bilgi</a>
                </div>
                <div class="matpilates">
                    <div class="card-overlay"></div>
                    <p class="lesson-title"></p>
                    <p class="lesson-desc desktop-only">Mat üzerinde vücut ağırlığı ile esneklik ve denge odaklı dersler.</p>
                    <a href="#" class="card-btn desktop-only">Detaylı Bilgi</a>
                </div>           
            </div>
        </section>

        <!-- 3. Stats / Trust Bar -->
        <section class="thirdcontainer stats-section">
            <p class="trusttext"></p>
            <div class="verticalline1"></div>
            <p class="trusttext"></p>
            <div class="verticalline1"></div>
            <p class="trusttext"></p>
        </section>

        <!-- 4. Why Us / Values -->
        <section class="fourthcontainer why-us-section">
            <p class="header3"></p>
            <ul>
                <li class="valuetext"></li>
                <li class="valuetext"></li>
                <li class="valuetext"></li>
            </ul>
        </section>

        <!-- 5. Trainer Profile -->
        <section class="fifthcontainer trainer-section">
            <div class="profilepic"><img src="" alt="Eğitmen Fotoğrafı"></div>
            <div class="profilename"><p></p></div>
            <div class="profilespecialty"><p></p></div>
            <div>
                <a href="#">
                    <img src="" alt="Eğitmen Detay">
                </a>
            </div>                  
        </section>

        <!-- 6. Reviews / Testimonials -->
        <section class="sixthcontainer reviews-section">
            <div class="header4">
                <p></p>
            </div>
            <div class="quotebox">
                <div class="quotetext">
                    <p></p>
                </div>
                <div class="reviewbox">
                    <div class="nametext"><p></p></div>
                    <div><img src="" alt="Değerlendirme Yıldızları"></div>
                </div>
            </div>  
        </section>   

        <!-- 7. Map & Contact -->
        <section class="seventhcontainer location-section">
            <div class="mapcard"><img src="" alt="Harita Konumu"></div>
            <div class="infocard">
                <div class="workinghourtext"><p></p></div>
                <a class="getdirection" href="#"><p></p></a>
                <a class="whatappcall" href="#"><img src="" alt="WhatsApp İletişim"></a>         
            </div>
        </section>         

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-logo">
            <img src="" alt="Numa Studio Logo">
            <p></p>
        </div>

        <nav class="navigationlinkcont">
            <ul>
                <li><a href="#"><p></p></a></li>
                <li><a href="#"><p></p></a></li>
                <li><a href="#"><p></p></a></li>
                <li><a href="#"><p></p></a></li>
            </ul>
        </nav>

        <div class="bottombox">
            <div class="contactcont">
                <div class="contacttext">
                    <ul>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                </div>
            </div>
            <div class="social-media"></div>
        </div>

        <div class="bottombar">
            <div class="legaltext"><p></p></div>
        </div>
    </footer>

</body>
</html>
